# Render Deployment Blueprint Configuration
services:
  # Frontend Static Site
  - type: static
    name: synctube-watchparty-platform-frontend
    repo: https://github.com/Krishnasingh9999/synctube-watchparty-platform
    buildCommand: npm run build
    publishPath: client/dist
    routes:
      # Rewrite rule to handle React Router client-side routing (fixes 404/Not Found on direct links)
      - type: rewrite
        source: /*
        destination: /index.html

  # Backend Web Service
  - type: web
    name: synctube-watchparty-platform-backend
    repo: https://github.com/Krishnasingh9999/synctube-watchparty-platform
    env: node
    buildCommand: npm install
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
